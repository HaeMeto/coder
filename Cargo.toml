[package]
name = "coder"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true # Automatically strip symbols from the binary.
lto = true

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-widget-list = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "time", "io-util"] }
ropey = "1.6"
syntect = "5.2"
git2 = "0.20"
portable-pty = "0.9"
vt100 = "0.15"
ignore = "0.4"
regex = "1"
unicode-width = "0.2"
anyhow = "1"
thiserror = "2"
arboard = "3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
